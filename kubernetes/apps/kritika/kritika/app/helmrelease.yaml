---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    replicas: 2
    # 0.0.65+ must not run alongside older thread workers
    strategy:
      type: Recreate
      rollingUpdate: null
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      webUrl: https://kritika.${SECRET_DOMAIN}
      auth:
        admin:
          password: { env: KRITIKA_AUTH_ADMIN_PASSWORD }
      apps:
        github:
          accounts: [bprins]
          clientId: { env: GITHUB_APP_CLIENT_ID }
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        openrouter:
          type: openrouter
          apiKey: { env: OPENROUTER_API_KEY }
      review:
        model: openrouter/openai/gpt-6.1-sol
        fallback: openrouter/anthropic/claude-opus-5.5
      embedding:
        model: openrouter/voyageai/voyage-code-4
        dims: 1024
      egress:
        allow: [raw.githubusercontent.com]
      agent: { steps: 20 }
    env:
      KRITIKA_AUTH_ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef: { name: kritika-secret, key: KRITIKA_AUTH_ADMIN_PASSWORD }
      GITHUB_APP_CLIENT_ID:
        valueFrom:
          secretKeyRef: { name: kritika-secret, key: GITHUB_APP_CLIENT_ID }
      GITHUB_APP_PRIVATE_KEY:
        valueFrom:
          secretKeyRef: { name: kritika-secret, key: GITHUB_APP_PRIVATE_KEY }
      GITHUB_APP_WEBHOOK_SECRET:
        valueFrom:
          secretKeyRef: { name: kritika-secret, key: GITHUB_APP_WEBHOOK_SECRET }
      OPENROUTER_API_KEY:
        valueFrom:
          secretKeyRef: { name: kritika-secret, key: OPENROUTER_API_KEY }
    database:
      owner:
        existingSecret: kritika-postgres-credentials
      app:
        existingSecret: kritika-postgres-app
      runner:
        existingSecret: kritika-postgres-runner
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |
          path: /api/v1/meta
          conditions:
            - "[STATUS] == 200"
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
      hostnames:
        - kritika.${SECRET_DOMAIN}
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    networkPolicy:
      enabled: true
      type: cilium
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    runner:
      podTemplate:
        spec:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
