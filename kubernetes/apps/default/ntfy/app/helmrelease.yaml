---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      ntfy:
        containers:
          app:
            image:
              repository: docker.io/binwiederhier/ntfy
              tag: v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
            args: ["serve"]
            env:
              # The iOS app fetches messages from this URL after an upstream poll request
              NTFY_BASE_URL: "https://ntfy.${SECRET_DOMAIN}"
              NTFY_LISTEN_HTTP: ":8080"
              NTFY_BEHIND_PROXY: "true"
              # Only Apple's push service can wake iOS, and it only accepts ntfy.sh
              NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
              NTFY_CACHE_FILE: /data/cache.db
              # Long enough for the phone to catch up after time away from home
              NTFY_CACHE_DURATION: 168h
              TZ: Europe/Amsterdam
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: ntfy
        ports:
          http:
            port: 80
            targetPort: *port
    persistence:
      data:
        # PVC is created by the ntfy-backup Kustomization so kopiur can populate
        # it from the latest snapshot on a rebuild
        existingClaim: ntfy-data
        globalMounts:
          - path: /data
