---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    receiver: ntfy
    groupBy:
      - alertname
      - severity
      - node
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # Inhibition source from kube-prometheus-stack defaultRules
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # Deadman's switch from defaultRules; always firing. Should be repointed at a heartbeat endpoint
      - receiver: blackhole
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      # Desktops monitored with ohmgraphite are regularly powered off
      - receiver: blackhole
        matchers:
          - name: alertname
            value: TargetDown
            matchType: =
          - name: job
            value: ohmgraphite
            matchType: =
      - receiver: ntfy
        matchers:
          - name: severity
            value: critical
            matchType: =
        groupWait: 10s
        repeatInterval: 1h
  inhibitRules:
    - equal:
        - alertname
        - namespace
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: ntfy
      webhookConfigs:
        # ntfy's built-in template turns the Alertmanager payload into a readable message
        - url: http://ntfy.default.svc.cluster.local/home-ops?template=alertmanager
          sendResolved: true
    - name: blackhole
