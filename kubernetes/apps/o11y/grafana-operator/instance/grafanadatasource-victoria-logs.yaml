---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: victoria-logs
  datasource:
    type: victoriametrics-logs-datasource
    name: victoria-logs
    access: proxy
    url: http://victoria-logs.o11y.svc.cluster.local:9428
  plugins:
    - name: victoriametrics-logs-datasource
      # Tracks the grafana.com plugin catalog, not the plugin's GitHub releases: Grafana
      # installs from the catalog, and a GitHub tag is only installable once it is published
      # there. Pinning ahead of the catalog fails the install and Grafana refuses to start.
      # renovate: datasource=custom.grafana-plugins depName=victoriametrics-logs-datasource
      version: 0.31.0
