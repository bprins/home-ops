---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: grafana
spec:
  compression:
    compressor: zstd
  # The repository credential Secret lives in kopiur-system
  credentialProjection:
    enabled: true
  mover:
    cache:
      capacity: 5Gi
      mode: Persistent
      storageClassName: ceph-block
    securityContext:
      # mover needs to match grafana UID/GID
      runAsUser: 1000
      runAsGroup: 1000
  repository:
    kind: ClusterRepository
    name: truenas
  retention:
    keepLatest: 3
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
  sources:
    - pvc:
        name: grafana-pvc
  volumeSnapshotClassName: csi-ceph-blockpool
