---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  # Chart drops the dashboards' `condition:` gate, so it ships a Vector dashboard
  # we don't use. Name comes from vm.fullname` at the chart root (<release>-<chart>).
  # Ref: https://github.com/VictoriaMetrics/helm-charts/issues/2896
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: GrafanaDashboard
              name: victoria-logs-victoria-logs-single-vector-k8s-monitoring
            patch: |
              $patch: delete
              apiVersion: grafana.integreatly.org/v1beta1
              kind: GrafanaDashboard
              metadata:
                name: victoria-logs-victoria-logs-single-vector-k8s-monitoring
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      retentionPeriod: 90d
      serviceMonitor:
        enabled: true
