---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      repo: github://bprins/home-ops
      kubeVersion: "1.37.0"
      statusChecks: true
      statusCheckName: Konflate
      prComments: true
      mergeCommand: "gh pr merge {{ .Number }} --repo {{ .Repo }} --squash --delete-branch"
      mcp: true
      verifyImages: true
    secret:
      existingSecret: konflate-secret
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |
          conditions:
            - "[STATUS] == 200"
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
      hostnames:
        - konflate.${SECRET_DOMAIN}
    monitoring:
      serviceMonitor:
        enabled: true
    persistence:
      enabled: true
      storageClass: ceph-block
      size: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
