---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: mail
spec:
  endpoints:
    - dnsName: "${SECRET_DOMAIN}"
      recordType: TXT
      targets:
        - "v=spf1 -all"
    - dnsName: "_dmarc.${SECRET_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DMARC1; p=reject; aspf=s; adkim=s"
