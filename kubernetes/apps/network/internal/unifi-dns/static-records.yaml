---
# Static records that used to live in k8s-gateway's `static.zone`.
# external-dns has no "zone file" input, so they are declared as annotation-only
# Services. Services are only watched by this instance (the Cloudflare instance
# watches crd + gateway-httproute), so these can never leak into public DNS.
#
# They are headless and portless: nothing routes to them, they only carry the
# annotations. external-dns reads the target annotation before it looks at the
# Service type, so no ClusterIP is allocated and no endpoints are needed.
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.33.0-standalone-strict/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: record-truenas
  annotations:
    external-dns.alpha.kubernetes.io/hostname: truenas.${SECRET_DOMAIN}
    external-dns.alpha.kubernetes.io/target: 10.10.0.11
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  type: ClusterIP
  clusterIP: None
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.33.0-standalone-strict/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: record-truenas-aliases
  annotations:
    external-dns.alpha.kubernetes.io/hostname: >-
      forgejo.${SECRET_DOMAIN},
      matrix.${SECRET_DOMAIN},
      litellm.${SECRET_DOMAIN}
    external-dns.alpha.kubernetes.io/target: truenas.${SECRET_DOMAIN}
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  type: ClusterIP
  clusterIP: None
