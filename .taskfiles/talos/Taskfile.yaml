---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

# topf applies to control-plane nodes one at a time and runs its own
# diff-and-confirm prompt, so day-2 recipes rely on that rather than
# generating configs first.

tasks:

  nodes:
    desc: List all nodes and their current state
    dir: '{{.TALOS_DIR}}'
    cmd: topf nodes
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf

  diff:
    desc: Show pending Talos config changes without applying
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --dry-run
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  render:
    desc: Render Talos machine configs to ./rendered
    dir: '{{.TALOS_DIR}}'
    cmd: topf render --output ./rendered
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  apply:
    desc: Apply Talos config to all nodes (shows a diff and asks first)
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOSCONFIG}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  apply-node:
    desc: Apply Talos config to a node [NODE=required, MODE=auto]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --nodes-filter '^{{.NODE}}$' --mode {{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOSCONFIG}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  upgrade:
    desc: Upgrade Talos on all nodes, one at a time (drains first)
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOSCONFIG}}
      - which topf

  upgrade-node:
    desc: Upgrade Talos on a single node [NODE=required]
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade --nodes-filter '^{{.NODE}}$'
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOSCONFIG}}
      - which topf

  upgrade-k8s:
    desc: Upgrade Kubernetes
    dir: '{{.TALOS_DIR}}'
    # topf intentionally does not manage Kubernetes upgrades
    cmd: talosctl --nodes {{.CONTROLLER}} upgrade-k8s --to {{.KUBERNETES_VERSION}}
    vars:
      CONTROLLER:
        sh: yq '[.nodes[] | select(.role == "control-plane")][0].ip' {{.TALOS_DIR}}/topf.yaml
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --confirm=false
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf
